
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}JobTrack{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<nav class="navbar navbar-expand-lg app-nav">
  <div class="container-fluid px-4">
    <a class="navbar-brand fw-bold" href="{{ url_for('dashboard') }}">
      <span class="brand-icon"><i class="bi bi-briefcase-fill"></i></span> JobTrack
    </a>
    <div class="d-flex gap-2">
      <a href="{{ url_for('dashboard') }}" class="btn btn-sm nav-btn"><i class="bi bi-grid-1x2"></i> Dashboard</a>
      <a href="{{ url_for('add_application') }}" class="btn btn-sm btn-primary"><i class="bi bi-plus-lg"></i> Add Application</a>
    </div>
  </div>
</nav>
<main class="container-fluid px-4 py-4">
{% with messages = get_flashed_messages(with_categories=true) %}
  {% for category, message in messages %}
    <div class="alert alert-{{ category }} alert-dismissible fade show shadow-sm">
      {{ message }} <button class="btn-close" data-bs-dismiss="alert"></button>
    </div>
  {% endfor %}
{% endwith %}
{% block content %}{% endblock %}
</main>
<footer class="text-center text-secondary py-4 small">JobTrack • Final Year Project • Python Flask + SQLite</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
