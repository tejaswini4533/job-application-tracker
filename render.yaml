services:
  - type: web
    name: jobtrack
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: jobtrack-db
          property: connectionString

databases:
  - name: jobtrack-db
    databaseName: jobtrack
    user: jobtrack
