{% extends "base.html" %}
{% block title %}500 Server Error — JobTrack{% endblock %}
{% block content %}
<div class="error-page">
  <div>
    <div class="error-code">500</div>
    <div class="error-title">Something went wrong</div>
    <p class="error-sub">An unexpected error occurred. Please try again later.</p>
    <a href="{{ url_for('main.dashboard') if current_user.is_authenticated else url_for('main.landing') }}" class="btn btn-primary">Go Home</a>
  </div>
</div>
{% endblock %}
